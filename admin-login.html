<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Admin Login — ParahVine GlobalTech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b0013 0%, #32023b 60%, #5a0070 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            text-align: center;
        }

        .login-card img {
            height: 48px;
            width: auto;
            margin-bottom: 18px;
        }

        .login-card h1 {
            font-size: 1.4rem;
            color: #32023b;
            margin-bottom: 6px;
        }

        .login-card p.sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            color: #32023b;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 22px;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #32023b;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #32023b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .login-btn:hover { background: #5a0070; }
        .login-btn:disabled { background: #999; cursor: not-allowed; }

        .error-msg {
            display: none;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            font-size: 13px;
            color: #888;
            text-decoration: none;
        }
        .back-link:hover { color: #32023b; }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="lock-icon">🔐</div>
        <img src="pvlogouss.png" alt="ParahVine GlobalTech Logo">
        <h1>Team Admin Portal</h1>
        <p class="sub">Restricted access — ParahVine GlobalTech staff only</p>

        <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>

        <form id="loginForm">
            <label for="password">Admin Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter admin password" required autofocus>

            <button type="submit" class="login-btn" id="loginBtn">LOGIN</button>
        </form>

        <a href="index.html" class="back-link">← Back to website</a>
    </div>

    <script>
        // If already logged in, go straight to admin dashboard
        if (sessionStorage.getItem('pvgt_admin_token')) {
            window.location.href = 'admin.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                const data = await res.json();

                if (data.success) {
                    // Store token in sessionStorage (cleared when browser tab closes)
                    sessionStorage.setItem('pvgt_admin_token', data.token);
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'LOGIN';
            }
        });
    </script>

</body>
</html>
